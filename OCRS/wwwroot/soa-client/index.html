<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OCRS Course API Consumer</title>
<style>body{margin:0;font-family:system-ui;color:#102e4a;background:#eef4f7}header,main{max-width:1100px;margin:auto}header{padding:5rem 1rem 2rem}h1{font-size:clamp(2.5rem,7vw,5rem);letter-spacing:-.06em;line-height:.95;margin:.5rem 0}header p{color:#587286}.bar{display:flex;gap:.5rem;padding:1rem;background:white;box-shadow:0 8px 30px #17344c18}input{flex:1;padding:.9rem;border:1px solid #b6c9d4}button{border:0;background:#1264a3;color:white;font-weight:700;padding:0 1.4rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem;padding:2rem 0}.card{background:white;padding:1.5rem;border-top:4px solid #13a7a0}.card small{color:#1264a3}.card p{color:#607989}.meta{display:flex;justify-content:space-between;font-size:.8rem;border-top:1px solid #dce5ea;padding-top:1rem}footer{text-align:center;padding:2rem;color:#718796}@media(max-width:600px){.bar{flex-direction:column}button{padding:.9rem}}</style></head>
<body><header><small>INDEPENDENT HTML/JAVASCRIPT CLIENT</small><h1>OCRS Course<br>API Consumer</h1><p>Trang tĩnh này không dùng Entity Framework hay gọi phương thức C#. Dữ liệu được lấy qua HTTP/JSON từ Course Service.</p></header><main><div class="bar"><input id="q" placeholder="Tìm khóa học, ví dụ IELTS"><button id="search">Tìm kiếm</button><button id="all">Tất cả</button></div><div id="state"></div><section id="courses" class="grid"></section></main><footer><a href="/SOADemo">← Quay về SOA Demo</a></footer>
<script>const list=document.querySelector('#courses'),state=document.querySelector('#state'),q=document.querySelector('#q');async function load(keyword=''){state.textContent='Đang gọi Course API...';const url=keyword?`/api/soa/courses/search?keyword=${encodeURIComponent(keyword)}`:'/api/soa/courses';try{const r=await fetch(url,{headers:{Accept:'application/json'}}),data=await r.json();if(!r.ok)throw new Error(data.message||`HTTP ${r.status}`);state.textContent=`HTTP ${r.status} · ${data.length} khóa học`;list.innerHTML=data.map(x=>`<article class="card"><small>${x.courseCode} · ${x.categoryName}</small><h2>${x.courseName}</h2><p>${x.description||'Đang cập nhật mô tả.'}</p><div class="meta"><span>${x.duration} giờ</span><strong>${Number(x.tuitionFee).toLocaleString('vi-VN')} đ</strong></div></article>`).join('')||'<p>Không có kết quả.</p>'}catch(e){state.textContent=e.message;list.innerHTML=''}}document.querySelector('#search').onclick=()=>load(q.value.trim());document.querySelector('#all').onclick=()=>{q.value='';load()};q.addEventListener('keydown',e=>{if(e.key==='Enter')load(q.value.trim())});load();</script></body></html>
